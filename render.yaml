# Render Blueprint: https://render.com/docs/blueprint-spec
databases:
  - name: cardarena-db
    plan: free
    databaseName: cardarena
    user: cardarena

services:
  - type: web
    name: cardarena-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cardarena-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false # set to the frontend URL, e.g. https://cardarena.onrender.com

  - type: web
    name: cardarena
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      # Proxy the API through the frontend's domain so the refresh cookie stays same-site.
      # Update this if Render gives the API a different URL.
      - type: rewrite
        source: /api/*
        destination: https://cardarena-api.onrender.com/api/*
      # SPA fallback for Angular routes.
      - type: rewrite
        source: /*
        destination: /index.html
